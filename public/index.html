<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线德州扑克</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- 大厅界面 -->
    <div id="lobby" class="screen active">
      <div class="lobby-card">
        <div class="suit-row">♠ ♥ ♦ ♣</div>
        <h1>在线德州扑克</h1>
        <p class="subtitle">与朋友跨网对战 · 浏览器即开即玩</p>

        <div class="form-group">
          <label for="playerName">你的昵称</label>
          <input type="text" id="playerName" placeholder="输入昵称" maxlength="12" autocomplete="off">
        </div>

        <div class="lobby-actions">
          <button id="createBtn" class="btn btn-primary">创建房间</button>
          <div class="divider">或</div>
          <div class="join-row">
            <input type="text" id="roomCode" placeholder="房间号" maxlength="5" autocomplete="off" style="text-transform:uppercase">
            <button id="joinBtn" class="btn btn-secondary">加入</button>
          </div>
        </div>

        <div id="lobbyMessage" class="lobby-message"></div>
      </div>
    </div>

    <!-- 等待室界面 -->
    <div id="waitingRoom" class="screen">
      <div class="waiting-card">
        <h2>房间 <span id="displayRoomCode" class="room-code-display"></span></h2>
        <p class="waiting-hint">等待房主开始游戏...</p>
        <div id="playerList" class="player-list"></div>
        <button id="startGameBtn" class="btn btn-primary" style="display:none">开始游戏</button>
        <button id="leaveLobbyBtn" class="btn btn-secondary">离开房间</button>
      </div>
    </div>

    <!-- 游戏界面 -->
    <div id="game" class="screen">
      <div class="game-header">
        <span class="room-info">房间: <strong id="gameRoomCode"></strong></span>
        <span class="phase-info" id="phaseInfo"></span>
        <button id="leaveGameBtn" class="btn btn-small btn-danger">离开</button>
      </div>

      <div class="poker-table">
        <div id="opponentsArea" class="opponents-area"></div>

        <div class="table-center">
          <div class="pot-display">底池: <strong id="potAmount">0</strong></div>
          <div id="communityCards" class="community-cards"></div>
          <div id="gameMessage" class="game-message"></div>
        </div>

        <div class="my-area">
          <div id="myCards" class="my-cards"></div>
          <div class="my-info">
            <span id="myName"></span> · 筹码: <strong id="myChips">0</strong>
            <span id="myBet" class="bet-info"></span>
          </div>
        </div>
      </div>

      <div id="actionPanel" class="action-panel">
        <button id="foldBtn" class="btn btn-danger">弃牌</button>
        <button id="checkCallBtn" class="btn btn-secondary">过牌</button>
        <div class="raise-controls">
          <button id="raiseBtn" class="btn btn-primary">加注</button>
          <input type="range" id="raiseSlider" min="20" max="1000" value="40">
          <span id="raiseAmount" class="raise-amount">40</span>
        </div>
        <button id="allInBtn" class="btn btn-warning">全押</button>
      </div>

      <div id="nextHandPanel" class="next-hand-panel" style="display:none">
        <button id="nextHandBtn" class="btn btn-primary">开始下一手</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/ui.js"></script>
</body>
</html>
